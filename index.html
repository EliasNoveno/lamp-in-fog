<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lamp in fog</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {

        .notification-badge {

        }
        .notification-panel {
            position: fixed;

            width: 300px;
            max-height: 400px;
            background: #0a0a0a;

        .notification-item {

        }

        }
        .post-form {

        }
        .post-form textarea {

        .post-form input[type="file"] {

        }
        .post-form button {
            background: transparent;
            color: white;
            border: 1px solid #888;
            padding: 6px 12px;

        .post-form button:hover {

        .post {
            border: 1px solid rgba(255,255,255,0.2);

        .post .author {

        .post-actions {

        }
        .post-actions button {

        .post .attachment {

        .post .delete-btn {

        }
        .post .delete-btn:hover {

        }
        .comments-section {

        .comments-toggle {

        .comment {

        }
        .comment-author {

        .comment-content {

        }
        .comment-edited {

        }
        .add-comment {
            margin-top: 8px;
            display: flex;

        }
        .add-comment input {
            flex: 1;

            border: 1px solid #444;

        .add-comment button {
            background: transparent;

        .float {
            position: fixed;
            animation: floatUp 2s ease-out forwards;

        .user-list {

        .user-item .admin-badge {

        }
        .friend-item {
            color: #aaa;

        }
        .friend-item:hover {

        }
        .pending-photos {

        .pending-photos h4 {

        .delete-account-btn, .change-password-btn {

<body>

<div class="container">
    <div class="top-menu" id="topMenu">
        <span class="site-title" onclick="showFeed()">lamp in fog</span>
        <div class="menu-buttons" id="menuButtons" style="display:none;">
            <button onclick="showFeed()" class="active-btn">feed</button>
            <button onclick="showPoems()">poems</button>
            <button onclick="showPosts()">posts</button>
            <button onclick="showPhotos()">photos</button>
            <button onclick="showMusic()">music</button>
            <button onclick="showFiles()">files</button>
            <button onclick="showUserList()">users</button>
            <button onclick="showStatistics()">statistics</button>
        </div>
        <div class="search-area" id="searchArea" style="display:none;">
            <input type="text" class="search-input" id="searchInput" placeholder="find smth..." onkeyup="handleSearch(event)">
        </div>
        <div class="auth-area" id="authArea">
            <button id="btnLogin" style="display:inline-block;">log in</button>
            <button id="btnRegister" style="display:inline-block;">registration</button>
            <span class="logged-user" id="loggedUser" style="display:none;" onclick="showProfile(currentUser?.username)"></span>
            <button class="logout-btn" id="btnLogout" style="display:none;">log out</button>
        </div>
    </div>

    <div id="content"><div class="loading">loading... :&gt;</div></div>
</div>

<div class="notification-icon" id="notificationIcon" style="display:none;">
    ☁
    <span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
</div>
<div class="notification-panel" id="notificationPanel"></div>

<script>
    let currentUser = null;
    let posts = [];
    let users = {};
    let pendingPhotos = [];
    let notifications = [];
    let commentsCache = {};
    let loadingInterval = null;
    let currentSearchQuery = '';
    let privateMessages = [];
    let blacklists = {};

    function floatEmoji(text) {
        const el = document.createElement('span');
        el.className = 'float';
        el.textContent = text;
        el.style.left = Math.random() * 80 + 10 + '%';
        el.style.bottom = '20%';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    function startLoadingEmojis() {
        if (loadingInterval) clearInterval(loadingInterval);
        loadingInterval = setInterval(() => {
            floatEmoji(':>');
        }, 300);
    }

    function stopLoadingEmojis() {
        if (loadingInterval) {
            clearInterval(loadingInterval);
            loadingInterval = null;
        }
    }

    function spawnLoginEmojis() {
        const emojis = ['ʕ •ᴥ• ʔ', ':>', 'ʕ •ᴥ• ʔ', ':>', 'ʕ •ᴥ• ʔ', ':>', '｡°✩'];
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                floatEmoji(emojis[Math.floor(Math.random() * emojis.length)]);
            }, i * 200);
        }
    }

    function spawnFriendEmoji() {
        floatEmoji('^•ﻌ•^');
    }

    function spawnEditEmoji() {
        const emojis = ['▓', '▒', '░', '◻', '◼', '▮', '▯'];
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                floatEmoji(emojis[Math.floor(Math.random() * emojis.length)]);
            }, i * 100);
        }
    }

    function formatDate(ts) {
        const d = new Date(ts);
        return d.toLocaleString();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function extractHashtags(text) {
        const hashtags = [];
        const regex = /#([\p{L}\p{N}_]+)/gu;
        let match;
        while ((match = regex.exec(text)) !== null) {
            hashtags.push(match[1]);
        }
        return [...new Set(hashtags)];
    }

    async function loadData() {
        startLoadingEmojis();
        try {
            const [usersRes, postsRes, pendingRes, pmRes, blacklistRes] = await Promise.all([
                fetch('/api/users'),
                fetch('/api/posts'),
                fetch('/api/pendingPhotos'),
                fetch('/api/privateMessages'),
                fetch('/api/blacklists')
            ]);
            if (!usersRes.ok || !postsRes.ok || !pendingRes.ok) throw new Error('server response not ok');
            users = await usersRes.json();
            posts = await postsRes.json();
            pendingPhotos = await pendingRes.json();
            if (pmRes.ok) privateMessages = await pmRes.json();
            if (blacklistRes.ok) blacklists = await blacklistRes.json();
            
            if (currentUser) {
                const notifRes = await fetch(`/api/notifications/${currentUser.username}`);
                if (notifRes.ok) {
                    notifications = await notifRes.json();
                    updateNotificationBadge();
                }
            }
        } catch(e) {
            console.error('failed to load data', e);
            renderContent('<p class="loading">failed to connect to server. make sure the backend is running.</p>');
        } finally {
            stopLoadingEmojis();
        }
    }

    async function loadComments(postId) {
        if (commentsCache[postId]) return commentsCache[postId];
        const res = await fetch(`/api/comments/${postId}`);
        if (res.ok) {
            const comments = await res.json();
            commentsCache[postId] = comments;
            return comments;
        }
        return [];
    }

    async function addComment(postId, content) {
        if (!currentUser || !content.trim()) return;
        const res = await fetch('/api/comments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ postId, author: currentUser.username, content: content.trim() })
        });
        if (res.ok) {
            delete commentsCache[postId];
            await loadComments(postId);
            renderCurrentView();
        }
    }

    async function editComment(commentId, postId, oldContent) {
        const newContent = prompt('edit comment:', oldContent);
        if (!newContent || newContent === oldContent) return;
        const res = await fetch(`/api/comments/${commentId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ content: newContent, edited: 1 })
        });
        if (res.ok) {
            delete commentsCache[postId];
            await loadComments(postId);
            renderCurrentView();
            spawnEditEmoji();
        }
    }

    async function deleteComment(commentId, postId) {
        const res = await fetch(`/api/comments/${commentId}`, { method: 'DELETE' });
        if (res.ok) {
            delete commentsCache[postId];
            await loadComments(postId);
            renderCurrentView();
        }
    }

    function updateNotificationBadge() {
        const unreadCount = notifications.filter(n => !n.read).length;
        const badge = document.getElementById('notificationBadge');
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    }

    async function loadNotifications() {
        if (!currentUser) return;
        const res = await fetch(`/api/notifications/${currentUser.username}`);
        if (res.ok) {
            notifications = await res.json();
            updateNotificationBadge();
            renderNotificationPanel();
        }
    }

    async function markNotificationRead(notifId) {
        await fetch(`/api/notifications/${notifId}/read`, { method: 'PUT' });
        await loadNotifications();
    }

    async function addNotification(targetUser, fromUser, type) {
        await fetch('/api/notifications', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ targetUser, fromUser, type })
        });
        if (currentUser && currentUser.username === targetUser) {
            await loadNotifications();
        }
    }

    function renderNotificationPanel() {
        const panel = document.getElementById('notificationPanel');
        if (!panel) return;
        
        if (notifications.length === 0) {
            panel.innerHTML = '<div style="padding:10px;color:#555;">no notifications</div>';
            return;
        }
        
        panel.innerHTML = notifications.map(n => `
            <div class="notification-item ${n.read ? '' : 'unread'}" onclick="markNotificationRead(${n.id}); showProfile('${escapeHtml(n.fromUser)}'); document.getElementById('notificationPanel').classList.remove('show')">
                <strong>${escapeHtml(n.fromUser)}</strong> ${n.type === 'friend' ? 'added you to fog-walkers' : n.type === 'pm' ? 'sent you a message' : ''}
                <div style="font-size:0.7em;color:#555;">${formatDate(n.time)}</div>
            </div>
        `).join('');
    }

    function renderContent(html) {
        document.getElementById('content').innerHTML = html;
    }

    let currentViewCallback = null;

    function renderCurrentView() {
        if (currentViewCallback) currentViewCallback();
    }

    function setActiveButton(btn) {
        if (!btn) return;
        const buttons = document.querySelectorAll('.menu-buttons button');
        buttons.forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    function handleSearch(event) {
        currentSearchQuery = event.target.value.toLowerCase();
        renderCurrentView();
    }

    function filterPostsBySearch(postsArray) {
        if (!currentSearchQuery) return postsArray;
        return postsArray.filter(p => 
            p.content.toLowerCase().includes(currentSearchQuery) || 
            p.author.toLowerCase().includes(currentSearchQuery) ||
            (p.hashtags && p.hashtags.some(h => h.toLowerCase().includes(currentSearchQuery)))
        );
    }

    async function showStatistics() {
        const buttons = document.querySelectorAll('.menu-buttons button');
        setActiveButton(buttons[7]);
        
        const totalUsers = Object.keys(users).length;
        const totalPosts = posts.filter(p => !p.pendingApproval).length;
        const totalPoems = posts.filter(p => p.isPoem === 1 && !p.pendingApproval).length;
        const totalMusic = posts.filter(p => p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i) && !p.pendingApproval).length;
        const totalPhotos = posts.filter(p => p.photo && !p.pendingApproval).length;
        const totalFiles = posts.filter(p => p.fileData && !p.pendingApproval && !p.photo && !p.fileName?.match(/\.(mp3|wav|ogg|m4a)$/i)).length;
        
        const html = `
            <h3>statistics</h3>
            <div class="profile-stats">
                <span>👥 users: ${totalUsers}</span>
                <span>📄 posts: ${totalPosts}</span>
                <span>✎ poems: ${totalPoems}</span>
                <span>🎵 music: ${totalMusic}</span>
                <span>🖼️ photos: ${totalPhotos}</span>
                <span>📎 files: ${totalFiles}</span>
            </div>
            <hr>
            <h3>top hashtags</h3>
            <div id="topHashtags"></div>
        `;
        renderContent(html);
        
        const hashtagCount = {};
        posts.forEach(p => {
            if (p.hashtags) {
                p.hashtags.forEach(h => {
                    hashtagCount[h] = (hashtagCount[h] || 0) + 1;
                });
            }
        });
        const topHashtags = Object.entries(hashtagCount).sort((a,b) => b[1] - a[1]).slice(0, 10);
        const hashtagDiv = document.getElementById('topHashtags');

    async function approvePhoto(pendingId) {
        const pendingPhoto = pendingPhotos.find(p => p.id === pendingId);

        const relatedPost = posts.find(p => p.pendingId === pendingId);
        if (relatedPost) {
            await fetch(`/api/posts/${relatedPost.id}`, { method: 'DELETE' });
        }
        
        const newPost = {
            author: pendingPhoto.author,
            content: '',
            time: Date.now(),
            photo: pendingPhoto.data,
            pendingApproval: 0
        };
        
        await fetch('/api/posts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(newPost)
        });
        
        await fetch(`/api/pendingPhotos/${pendingId}`, { method: 'DELETE' });

        showFeed();

    async function toggleBlock(username) {
        let blockList = blacklists[currentUser.username] || [];
        if (blockList.includes(username)) {
            blockList = blockList.filter(u => u !== username);
        } else {
            blockList.push(username);
        }
        await fetch('/api/blacklists', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: currentUser.username, blacklist: blockList })
        });
        await loadData();
    }

    function isBlocked(byUser, targetUser) {
        return blacklists[byUser]?.includes(targetUser);
    }

    async function sendPrivateMessage(toUser) {
        if (isBlocked(toUser, currentUser?.username)) {
            alert('you are blocked by this user');
            return;
        }
        if (isBlocked(currentUser?.username, toUser)) {
            alert('you have blocked this user');
            return;
        }
        const message = prompt(`send private message to ${toUser}:`);
        if (!message) return;
        
        await fetch('/api/privateMessages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                from: currentUser.username,
                to: toUser,
                message: message,
                time: Date.now()
            })
        });
        await addNotification(toUser, currentUser.username, 'pm');
        floatEmoji('✉️');
        if (currentViewCallback === showPrivateMessages) {
            showPrivateMessages();
        }
    }

    async function showPrivateMessages() {
        if (!currentUser) return;
        await loadData();
        const myMessages = privateMessages.filter(m => m.fromUser === currentUser.username || m.toUser === currentUser.username);
        const conversations = {};
        myMessages.forEach(msg => {
            const other = msg.fromUser === currentUser.username ? msg.toUser : msg.fromUser;
            if (!conversations[other]) conversations[other] = [];
            conversations[other].push(msg);
        });
        
        let html = '<h3>private messages</h3>';
        for (const [other, msgs] of Object.entries(conversations)) {
            if (isBlocked(currentUser.username, other)) continue;
            html += `
                <div class="pm-container">
                    <strong onclick="showProfile('${escapeHtml(other)}')" style="cursor:pointer;">${escapeHtml(other)}</strong>
                    <div id="pm-${escapeHtml(other)}">
                        ${msgs.sort((a,b) => a.time - b.time).map(m => `
                            <div class="pm-message ${m.fromUser === currentUser.username ? 'sent' : 'received'}">
                                <span style="color:#888;">${m.fromUser === currentUser.username ? '→' : '←'}</span>
                                ${escapeHtml(m.message)}
                                <span style="color:#555;font-size:0.7em;"> ${formatDate(m.time)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="add-comment" style="margin-top:8px;">
                        <input type="text" id="pm-input-${escapeHtml(other)}" placeholder="reply...">
                        <button onclick="sendReply('${escapeHtml(other)}', document.getElementById('pm-input-${escapeHtml(other)}').value)">send</button>
                    </div>
                </div>
            `;
        }
        if (Object.keys(conversations).length === 0) {
            html += '<p style="color:#555;">no messages yet</p>';
        }
        html += '<hr><button onclick="showFeed()" style="background:transparent;color:#888;border:1px solid #888;padding:6px;">back to feed</button>';
        renderContent(html);
        currentViewCallback = showPrivateMessages;
    }

    async function sendReply(toUser, message) {
        if (!message) return;
        await sendPrivateMessage(toUser);
        showPrivateMessages();
    }

    async function showProfile(username) {
        if (!username && !currentUser) return;
        const targetUser = username || currentUser.username;
        const user = users[targetUser];
        if (!user) return;
        
        if (currentUser && isBlocked(currentUser.username, targetUser)) {
            renderContent('<p style="color:#888;">user blocked</p><button onclick="showFeed()" style="background:transparent;color:#888;border:1px solid #888;padding:6px;margin-top:10px;">back to feed</button>');
            return;
        }
        
        const desc = user.description || '';
        const isOwnProfile = currentUser && currentUser.username === targetUser;
        const isAdmin = currentUser && currentUser.isAdmin;
        const isFriend = currentUser && (users[currentUser.username]?.friends || []).includes(targetUser);
        
        const userPosts = posts.filter(p => p.author === targetUser && !p.pendingApproval);
        const postsCount = userPosts.length;
        const poemsCount = userPosts.filter(p => p.isPoem === 1).length;
        const musicCount = userPosts.filter(p => p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i)).length;
        const photosCount = userPosts.filter(p => p.photo).length;

        let html = `
            <h2>${escapeHtml(targetUser)}${user.isAdmin ? ' <span style="color:#888;font-size:0.7em;">admin</span>' : ''}</h2>
            <p style="color:#aaa;">${escapeHtml(desc) || 'no description yet'}</p>
            <div class="profile-stats">
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'all')">📄 posts [${postsCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'poems')">✎ poems [${poemsCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'music')">🎵 music [${musicCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'photos')">🖼️ photos [${photosCount}]</span>
            </div>
        `;

        if (isOwnProfile) {
            html += `
                <textarea id="descInput" rows="3" maxlength="300" placeholder="your description (max 300)">${escapeHtml(desc)}</textarea>
                <button id="saveDesc">save description</button>
                <button id="changePasswordBtn" class="change-password-btn">change password</button>
                <button id="deleteMyAccount" class="delete-account-btn">delete my account</button>
                <button onclick="showPrivateMessages()" style="background:transparent;color:#888;border:1px solid #888;padding:6px;margin:4px;">📬 messages</button>
            `;
        }

        if (!isOwnProfile && currentUser && targetUser !== currentUser.username) {
            html += `<button id="toggleFriend">${isFriend ? 'remove from my fog-walkers' : 'add to my fog-walkers'}</button>`;
            html += `<button onclick="sendPrivateMessage('${escapeHtml(targetUser)}')" style="margin:4px;">✉️ send message</button>`;
            const isBlockedByMe = blacklists[currentUser.username]?.includes(targetUser);
            html += `<button id="toggleBlock" style="margin:4px;">${isBlockedByMe ? 'unblock user' : 'block user'}</button>`;
        }

        if (isAdmin && !user.isAdmin && targetUser !== currentUser.username) {
            html += `<button id="banUser" style="margin:4px;">${user.banned ? 'unban' : 'ban'}</button>`;
        }
        if (isAdmin && targetUser !== currentUser.username) {
            html += `<button id="delUser" style="color:#f00;border:1px solid #f00;margin:4px;">delete user</button>`;
        }

        html += '<h3>fog-walkers</h3>';
        const friends = user.friends || [];
        if (friends.length === 0) {
            html += '<p style="color:#555;">no fog-walkers yet</p>';
        } else {
            friends.forEach(f => {
                if (!(currentUser && isBlocked(currentUser.username, f))) {
                    html += `<div class="friend-item" onclick="showProfile('${escapeHtml(f)}')">${escapeHtml(f)}</div>`;
                }
            });
        }

        html += '<h3>posts</h3><div id="userPostsList"></div>';
        renderContent(html);
        
        await renderUserPosts(targetUser, 'all');

        if (isOwnProfile) {
            const saveDescBtn = document.getElementById('saveDesc');
            if (saveDescBtn) {
                saveDescBtn.onclick = async function() {
                    const val = document.getElementById('descInput').value;
                    await fetch(`/api/users/${currentUser.username}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ description: val })
                    });
                    await loadData();
                    showProfile(targetUser);
                };
            }
            const changePwdBtn = document.getElementById('changePasswordBtn');
            if (changePwdBtn) {
                changePwdBtn.onclick = async function() {
                    const oldPwd = prompt('current password:');
                    if (!oldPwd) return;
                    const newPwd = prompt('new password:');
                    if (!newPwd) return;
                    const confirmPwd = prompt('confirm new password:');
                    if (newPwd !== confirmPwd) {
                        alert('passwords do not match');
                        return;
                    }
                    const res = await fetch('/api/changePassword', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ username: currentUser.username, oldPassword: oldPwd, newPassword: newPwd })
                    });
                    if (res.ok) {
                        alert('password changed successfully! please log in again.');
                        spawnEditEmoji();
                        logout();
                    } else {
                        alert('failed to change password');
                    }
                };
            }
            const deleteBtn = document.getElementById('deleteMyAccount');
            if (deleteBtn) {
                deleteBtn.onclick = function() {
                    if (confirm('are you sure you want to delete your account? this cannot be undone.')) {
                        deleteUser(currentUser.username);
                    }
                };
            }
        }

        if (!isOwnProfile && currentUser && targetUser !== currentUser.username) {
            const toggleBtn = document.getElementById('toggleFriend');
            if (toggleBtn) {
                toggleBtn.onclick = async function() {
                    let friendsList = users[currentUser.username]?.friends || [];
                    if (isFriend) {
                        friendsList = friendsList.filter(f => f !== targetUser);
                    } else {
                        friendsList.push(targetUser);
                        await addNotification(targetUser, currentUser.username, 'friend');
                        spawnFriendEmoji();
                    }
                    await fetch(`/api/users/${currentUser.username}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ friends: friendsList })
                    });
                    await loadData();
                    showProfile(targetUser);
                };
            }
            const toggleBlockBtn = document.getElementById('toggleBlock');
            if (toggleBlockBtn) {
                toggleBlockBtn.onclick = async function() {
                    await toggleBlock(targetUser);
                    showProfile(targetUser);
                };
            }
        }

        if (isAdmin && !user.isAdmin && targetUser !== currentUser.username) {
            const banBtn = document.getElementById('banUser');
            if (banBtn) {
                banBtn.onclick = async function() {
                    await fetch(`/api/users/${targetUser}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ banned: !user.banned })
                    });
                    await loadData();
                    showProfile(targetUser);
                };
            }
        }
        
        if (isAdmin && targetUser !== currentUser.username) {
            const delUserBtn = document.getElementById('delUser');
            if (delUserBtn) {
                delUserBtn.onclick = function() { deleteUser(targetUser); };
            }
        }
    }

    async function renderUserPosts(username, filterType) {
        const container = document.getElementById('userPostsList');
        if (!container) return;
        
        let userPosts = posts.filter(p => p.author === username && !p.pendingApproval);
        if (filterType === 'poems') userPosts = userPosts.filter(p => p.isPoem === 1);
        else if (filterType === 'music') userPosts = userPosts.filter(p => p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i));
        else if (filterType === 'photos') userPosts = userPosts.filter(p => p.photo);
        
        userPosts.sort((a,b) => b.time - a.time);
        container.innerHTML = '';
        
        for (const p of userPosts) {
            const comments = await loadComments(p.id);
            const div = document.createElement('div');
            div.className = 'post';
            let attachmentHtml = '';
            if (p.photo) {
                attachmentHtml = `<div class="attachment"><img src="${p.photo}" style="max-width:100%;max-height:400px;"></div>`;
            } else if (p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                attachmentHtml = `<div class="attachment"><audio controls src="${p.fileData}"></audio><div><a href="${p.fileData}" download="${escapeHtml(p.fileName)}">🎵 ${escapeHtml(p.fileName)}</a></div></div>`;
            } else if (p.fileData) {
                attachmentHtml = `<div class="attachment"><a href="${p.fileData}" download="${escapeHtml(p.fileName)}">📎 ${escapeHtml(p.fileName)}</a></div>`;
            }
            const hashtagsHtml = p.hashtags && p.hashtags.length ? 
                `<div class="hashtags">${p.hashtags.map(h => `<span class="hashtag" onclick="searchByHashtag('${escapeHtml(h)}')">#${escapeHtml(h)}</span>`).join('')}</div>` : '';
            div.innerHTML = `
                <div class="author">${escapeHtml(p.author)} · ${formatDate(p.time)}${p.isPoem ? ' ✎' : ''}${p.edited ? '<span class="edited-badge">(edited)</span>' : ''}</div>
                <div class="content">${escapeHtml(p.content)}</div>
                ${hashtagsHtml}
                ${attachmentHtml}
                <div class="post-actions">
                    <button class="comments-toggle" onclick="toggleComments(${p.id})">cmnts (${comments.length})</button>
                    ${(currentUser && (currentUser.isAdmin || p.author === currentUser.username)) ? `<button onclick="editPost(${p.id}); setTimeout(() => showProfile('${username}'), 500)">redact</button>` : ''}
                </div>
                <div id="comments-${p.id}" style="display:none;" class="comments-section"></div>
            `;
            container.appendChild(div);
        }
    }

    function filterUserPosts(username, filterType) {
        renderUserPosts(username, filterType);
    }

    window.toggleCommentsInProfile = async function(postId) {
        const container = document.getElementById(`profile-comments-${postId}`);
        if (container && container.style.display === 'none') {
            const comments = await loadComments(postId);
            container.innerHTML = `
                ${comments.map(c => `
                    <div class="comment">
                        <div class="comment-author" onclick="showProfile('${escapeHtml(c.author)}')">${escapeHtml(c.author)} · ${formatDate(c.time)}${c.edited ? '<span class="comment-edited">(edited)</span>' : ''}</div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                        ${(currentUser && (currentUser.isAdmin || c.author === currentUser.username)) ? `<button onclick="deleteCommentFromProfile(${c.id}, ${postId})" style="background:transparent;color:#555;border:none;cursor:pointer;font-size:0.7em;">×</button>` : ''}
                    </div>
                `).join('')}
                <div class="add-comment">
                    <input type="text" id="profile-comment-input-${postId}" placeholder="add comment...">
                    <button onclick="addCommentToProfile(${postId}, document.getElementById('profile-comment-input-${postId}').value); document.getElementById('profile-comment-input-${postId}').value = ''">send</button>
                </div>
            `;
            container.style.display = 'block';
        } else if (container) {
            container.style.display = 'none';
        }
    };

    window.addCommentToProfile = async function(postId, content) {
        await addComment(postId, content);
        const container = document.getElementById(`profile-comments-${postId}`);
        if (container) container.style.display = 'none';
    };

    window.deleteCommentFromProfile = async function(commentId, postId) {
        await deleteComment(commentId, postId);
        const container = document.getElementById(`profile-comments-${postId}`);
        if (container) container.style.display = 'none';
    };

    async function deletePost(id) {
        await fetch(`/api/posts/${id}`, { method: 'DELETE' });
        await loadData();
        renderCurrentView();
    }

    async function publishPost() {
        const content = document.getElementById('postContent').value;
        const hashtagsInput = document.getElementById('postHashtags')?.value || '';
        const fileInput = document.getElementById('postFile');
        const file = fileInput.files[0];
        const isPoem = document.getElementById('isPoemCheckbox')?.checked || false;

        let allHashtags = [...extractHashtags(content)];
        const manualHashtags = hashtagsInput.split(/\s+/).filter(h => h.startsWith('#')).map(h => h.slice(1));
        allHashtags = [...new Set([...allHashtags, ...manualHashtags])];

        startLoadingEmojis();

        const newPost = {
            author: currentUser.username,
            content: content || '',
            time: Date.now(),
            isPoem: isPoem ? 1 : 0,
            hashtags: allHashtags
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                if (file.type.startsWith('image/')) {
                    const photoId = Date.now() + '_' + Math.random();
                    newPost.pendingApproval = 1;
                    newPost.pendingId = photoId;
                    
                    await fetch('/api/pendingPhotos', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ id: photoId, author: currentUser.username, data: e.target.result })
                    });
                    
                    await fetch('/api/posts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(newPost)
                    });
                } else {
                    newPost.fileName = file.name;
                    newPost.fileData = e.target.result;
                    
                    await fetch('/api/posts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(newPost)
                    });
                }
                await loadData();
                showFeed();
                stopLoadingEmojis();
            };
            reader.readAsDataURL(file);
        } else {
            await fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(newPost)
            });
            await loadData();
            showFeed();
            stopLoadingEmojis();
        }
    }

    async function addPhoto() {
        const fileInput = document.getElementById('photoFile');
        const file = fileInput.files[0];
        if (!file) return;
        
        startLoadingEmojis();
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const photoId = Date.now() + '_' + Math.random();
            
            await fetch('/api/pendingPhotos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: photoId, author: currentUser.username, data: e.target.result })
            });
            
            await fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    author: currentUser.username,
                    content: '',
                    time: Date.now(),
                    pendingApproval: 1,
                    pendingId: photoId
                })
            });
            
            await loadData();
            showPhotos();
            stopLoadingEmojis();
        };
        reader.readAsDataURL(file);
    }

    async function addFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) return;
        
        startLoadingEmojis();
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            await fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    author: currentUser.username,
                    content: '',
                    time: Date.now(),
                    fileName: file.name,
                    fileData: e.target.result
                })
            });
            await loadData();
            showFiles();
            stopLoadingEmojis();
        };
        reader.readAsDataURL(file);
    }

    async function deleteUser(username) {
        if (confirm(`are you sure you want to delete user "${username}"? this action cannot be undone.`)) {
            startLoadingEmojis();
            await fetch(`/api/users/${username}`, { method: 'DELETE' });
            if (currentUser && currentUser.username === username) {
                logout();
            } else {
                await loadData();
                if (document.getElementById('userListContainer')) {
                    showUserList();
                } else {
                    showFeed();
                }
            }
            stopLoadingEmojis();
        }
    }

    async function authenticate(username) {
        currentUser = { username: username, isAdmin: users[username]?.isAdmin || false };
        document.getElementById('btnLogin').style.display = 'none';
        document.getElementById('btnRegister').style.display = 'none';
        document.getElementById('loggedUser').textContent = username;
        document.getElementById('loggedUser').style.display = 'inline';
        document.getElementById('btnLogout').style.display = 'inline';
        document.getElementById('menuButtons').style.display = 'flex';
        document.getElementById('searchArea').style.display = 'flex';
        document.getElementById('notificationIcon').style.display = 'flex';
        spawnLoginEmojis();
        await loadNotifications();
        showFeed();
    }

    function logout() {
        stopLoadingEmojis();
        currentUser = null;
        notifications = [];
        commentsCache = {};
        currentSearchQuery = '';
        document.getElementById('btnLogin').style.display = 'inline-block';
        document.getElementById('btnRegister').style.display = 'inline-block';
        document.getElementById('loggedUser').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
        document.getElementById('menuButtons').style.display = 'none';
        document.getElementById('searchArea').style.display = 'none';
        document.getElementById('notificationIcon').style.display = 'none';
        renderContent('<p style="color:#888;">you have logged out. log in again to continue.</p>');
    }

    document.getElementById('btnLogout').onclick = logout;
    
    document.getElementById('notificationIcon').onclick = () => {
        const panel = document.getElementById('notificationPanel');
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) {
            renderNotificationPanel();
        }
    };
    
    document.getElementById('btnLogin').onclick = async function() {
        const name = prompt('username:');
        if (!name) return;
        const pass = prompt('password:');
        if (!pass) return;
        
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: name, password: pass })
            });
            
            if (res.status === 401) {
                alert('invalid credentials');
                return;
            }
            if (res.status === 403) {
                alert('account banned');
                return;
            }
            if (!res.ok) {
                alert('login failed');
                return;
            }
            
            await loadData();
            authenticate(name);
        } catch(e) {
            alert('connection error');
        }
    };
    
    document.getElementById('btnRegister').onclick = async function() {
        const name = prompt('choose username:');
        if (!name) return;
        if (name === 'Edd_Leon_CAt') { alert('username taken'); return; }
        const pass = prompt('choose password:');
        if (!pass) return;
        
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: name, password: pass })
            });
            
            if (res.status === 400) {
                alert('username taken');
                return;
            }
            if (!res.ok) {
                alert('registration failed');
                return;
            }
            
            await loadData();
            authenticate(name);
        } catch(e) {
            alert('connection error');
        }
    };

    (async () => {
        await loadData();
        renderContent('<p style="color:#888;">those who see the darkness light the lamp. log in or register to start.</p>');
    })();
</script>
