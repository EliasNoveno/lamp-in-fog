<script>
    let currentUser = null;
    let posts = [];
    let users = {};
    let pendingPhotos = [];
    let notifications = [];
    let commentsCache = {};
    let loadingInterval = null;
    let currentSearchQuery = '';
    let privateMessages = [];
    let blacklists = {};
    let currentPage = 1;
    let savedPosts = [];
    let chatTarget = null;
    const POSTS_PER_PAGE = 20;

    function getHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('token');
        if (token) {
            headers['Authorization'] = 'Bearer ' + token;
        }
        return headers;
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ---
    function floatEmoji(text) {
        const el = document.createElement('span');
        el.className = 'float';
        el.textContent = text;
        el.style.left = Math.random() * 80 + 10 + '%';
        el.style.bottom = '20%';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    function startLoadingEmojis() {
        if (loadingInterval) clearInterval(loadingInterval);
        loadingInterval = setInterval(() => floatEmoji(':>'), 300);
    }

    function stopLoadingEmojis() {
        if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
    }

    function spawnLoginEmojis() {
        const emojis = ['ʕ •ᴥ• ʔ', ':>', 'ʕ •ᴥ• ʔ', ':>', 'ʕ •ᴥ• ʔ', ':>', '｡°✩'];
        for (let i = 0; i < 6; i++) {
            setTimeout(() => floatEmoji(emojis[Math.floor(Math.random() * emojis.length)]), i * 200);
        }
    }

    function spawnFriendEmoji() { floatEmoji('^•ﻌ•^'); }
    function spawnEditEmoji() {
        const emojis = ['▓', '▒', '░', '◻', '◼', '▮', '▯'];
        for (let i = 0; i < 5; i++) setTimeout(() => floatEmoji(emojis[Math.floor(Math.random() * emojis.length)]), i * 100);
    }

    function formatDate(ts) { return new Date(ts).toLocaleString(); }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function extractHashtags(text) {
        const hashtags = [];
        const regex = /#([\p{L}\p{N}_]+)/gu;
        let match;
        while ((match = regex.exec(text)) !== null) hashtags.push(match[1]);
        return [...new Set(hashtags)];
    }

    // --- ЗАГРУЗКА ДАННЫХ ---
    async function loadData() {
        startLoadingEmojis();
        try {
            const headers = getHeaders();
            const [usersRes, postsRes, pendingRes, pmRes, blacklistRes, savedRes] = await Promise.all([
                fetch('/api/users', { headers }),
                fetch('/api/posts', { headers }),
                fetch('/api/pendingPhotos', { headers }),
                fetch('/api/privateMessages', { headers }),
                fetch('/api/blacklists', { headers }),
                fetch('/api/saved', { headers })
            ]);
            if (!usersRes.ok || !postsRes.ok || !pendingRes.ok) throw new Error('server response not ok');
            users = await usersRes.json();
            posts = await postsRes.json();
            pendingPhotos = await pendingRes.json();
            if (pmRes.ok) privateMessages = await pmRes.json();
            if (blacklistRes.ok) blacklists = await blacklistRes.json();
            if (savedRes.ok) savedPosts = await savedRes.json();
            
            if (currentUser) {
                const notifRes = await fetch(`/api/notifications/${currentUser.username}`, { headers });
                if (notifRes.ok) {
                    notifications = await notifRes.json();
                    updateNotificationBadge();
                }
            }
        } catch(e) {
            console.error('failed to load data', e);
            renderContent('<p class="loading">failed to connect to server.</p>');
        } finally { stopLoadingEmojis(); }
    }

    async function loadComments(postId) {
        if (commentsCache[postId]) return commentsCache[postId];
        const res = await fetch(`/api/comments/${postId}`, { headers: getHeaders() });
        if (res.ok) { commentsCache[postId] = await res.json(); return commentsCache[postId]; }
        return [];
    }

    function renderContent(html) { document.getElementById('content').innerHTML = html; }
    let currentViewCallback = null;
    function renderCurrentView() { if (currentViewCallback) currentViewCallback(); }

    function setActiveButton(btn) {
        if (!btn) return;
        document.querySelectorAll('.menu-buttons button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    function handleSearch(e) {
        currentSearchQuery = e.target.value.toLowerCase();
        currentPage = 1;
        renderCurrentView();
    }

    function filterPostsBySearch(arr) {
        if (!currentSearchQuery) return arr;
        return arr.filter(p => 
            p.content.toLowerCase().includes(currentSearchQuery) || 
            p.author.toLowerCase().includes(currentSearchQuery) ||
            (p.hashtags && p.hashtags.some(h => h.toLowerCase().includes(currentSearchQuery)))
        );
    }

    // --- ПАГИНАЦИЯ ---
    function renderPagination(totalPosts, callback) {
        const totalPages = Math.ceil(totalPosts / POSTS_PER_PAGE);
        if (totalPages <= 1) return '';
        let html = '<div class="pagination">';
        for (let i = 1; i <= totalPages; i++) {
            html += `<a onclick="goToPage(${i}, '${callback}')" class="${i === currentPage ? 'active' : ''}">[${i}]</a>`;
        }
        html += '</div>';
        return html;
    }

    window.goToPage = function(page, callback) {
        currentPage = page;
        if (callback === 'showFeed') showFeed();
        else if (callback === 'showPoems') showPoems();
        else if (callback === 'showPosts') showPosts();
        else if (callback === 'showMusic') showMusic();
        else if (callback === 'showPhotos') showPhotos();
        else if (callback === 'showFiles') showFiles();
        else if (callback === 'showSaved') showSaved();
        else renderCurrentView();
    };

    // --- УВЕДОМЛЕНИЯ ---
    function updateNotificationBadge() {
        const unreadCount = notifications.filter(n => !n.read).length;
        const badge = document.getElementById('notificationBadge');
        if (unreadCount > 0) { badge.textContent = unreadCount; badge.style.display = 'block'; }
        else { badge.style.display = 'none'; }

        if (!currentUser) return;
        const headers = getHeaders();
        const res = await fetch(`/api/notifications/${currentUser.username}`, { headers });
        if (res.ok) { notifications = await res.json(); updateNotificationBadge(); renderNotificationPanel(); }

        await fetch(`/api/notifications/${notifId}/read`, { method: 'PUT', headers: getHeaders() });
        await loadNotifications();
    }

    async function addNotification(targetUser, fromUser, type) {
        await fetch('/api/notifications', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ targetUser, fromUser, type })
        });
        if (currentUser && currentUser.username === targetUser) await loadNotifications();

    function renderNotificationPanel() {

    // --- СОХРАНЁННЫЕ ПОСТЫ ---
    async function toggleSave(postId) {
        if (!currentUser) { alert('log in first'); return; }
        const isSaved = savedPosts.includes(postId);
        const res = await fetch('/api/saved', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ postId, action: isSaved ? 'remove' : 'add' })
        });
        if (res.ok) {
            if (isSaved) savedPosts = savedPosts.filter(id => id !== postId);
            else savedPosts.push(postId);
            renderCurrentView();
            floatEmoji(isSaved ? '☆' : '★');
        }
    }

    function isSaved(postId) { return savedPosts.includes(postId); }

    async function showSaved() {
        const buttons = document.querySelectorAll('.menu-buttons button');
        setActiveButton(buttons[8]);
        const savedPostsData = posts.filter(p => savedPosts.includes(p.id) && !p.pendingApproval);
        let html = '<h3>☆ saved posts</h3>';
        html += '<div id="savedList"></div>';
        html += '<div id="paginationContainer"></div>';
        renderContent(html);
        await renderSavedList(savedPostsData);
        currentViewCallback = async () => { await renderSavedList(savedPostsData); };
    }

    async function renderSavedList(savedPostsData) {
        const list = document.getElementById('savedList');
        if (!list) return;
        list.innerHTML = '';
        const sorted = [...savedPostsData].sort((a,b) => b.time - a.time);
        if (sorted.length === 0) {
            list.innerHTML = '<p style="color:#555;">no saved posts yet</p>';
            return;
        }
        for (const p of sorted) {
            const comments = await loadComments(p.id);
            const div = document.createElement('div');
            div.className = 'post';
            let attachmentHtml = '';
            if (p.photo) attachmentHtml = `<div class="attachment"><img src="${p.photo}" style="max-width:100%;max-height:400px;"></div>`;
            else if (p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i))
                attachmentHtml = `<div class="attachment"><audio controls src="${p.fileData}"></audio><div><a href="${p.fileData}" download="${escapeHtml(p.fileName)}">🎵 ${escapeHtml(p.fileName)}</a></div></div>`;
            else if (p.fileData)
                attachmentHtml = `<div class="attachment"><a href="${p.fileData}" download="${escapeHtml(p.fileName)}">📎 ${escapeHtml(p.fileName)}</a></div>`;
            const hashtagsHtml = p.hashtags && p.hashtags.length ? 
                `<div class="hashtags">${p.hashtags.map(h => `<span class="hashtag" onclick="searchByHashtag('${escapeHtml(h)}')">#${escapeHtml(h)}</span>`).join('')}</div>` : '';
            div.innerHTML = `
                <div class="author" onclick="showProfile('${escapeHtml(p.author)}')">${escapeHtml(p.author)} · ${formatDate(p.time)}${p.isPoem ? ' ✎' : ''}${p.edited ? '<span class="edited-badge">(edited)</span>' : ''}</div>
                <div class="content">${escapeHtml(p.content)}</div>
                ${hashtagsHtml}
                ${attachmentHtml}
                <div class="post-actions">
                    <button onclick="toggleSave(${p.id})">${isSaved(p.id) ? '★' : '☆'}</button>
                    <button class="comments-toggle" onclick="toggleComments(${p.id})">cmnts (${comments.length})</button>
                </div>
                <div id="comments-${p.id}" style="display:none;" class="comments-section"></div>
            `;
            list.appendChild(div);
        }
    }

    // --- КОММЕНТАРИИ ---
    async function addComment(postId, content) {
        if (!currentUser || !content.trim()) return;
        const res = await fetch('/api/comments', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ postId, author: currentUser.username, content: content.trim() })
        });

    async function editComment(commentId, postId, oldContent) {
        const newContent = prompt('edit comment:', oldContent);
        if (!newContent || newContent === oldContent) return;
        const res = await fetch(`/api/comments/${commentId}`, {
            method: 'PUT',
            headers: getHeaders(),
            body: JSON.stringify({ content: newContent, edited: 1 })
        });
        if (res.ok) { delete commentsCache[postId]; await loadComments(postId); renderCurrentView(); spawnEditEmoji(); }
    }

    async function deleteComment(commentId, postId) {
        const res = await fetch(`/api/comments/${commentId}`, { method: 'DELETE', headers: getHeaders() });
        if (res.ok) { delete commentsCache[postId]; await loadComments(postId); renderCurrentView(); }
    }

    async function toggleComments(postId) {
        const container = document.getElementById(`comments-${postId}`);
        if (container.style.display === 'none') {
            const comments = await loadComments(postId);
            container.innerHTML = `
                ${comments.map(c => `

    // --- ЛИЧНЫЕ СООБЩЕНИЯ (ЧАТ) ---
    function openChat(targetUser) {
        chatTarget = targetUser;
        document.getElementById('chatOverlay').classList.add('active');
        document.getElementById('chatTitle').textContent = '💬 ' + targetUser;
        renderChatMessages();
        document.getElementById('chatInput').focus();
    }

    function closeChat() {
        document.getElementById('chatOverlay').classList.remove('active');
        chatTarget = null;
    }

    async function renderChatMessages() {
        const container = document.getElementById('chatMessages');
        if (!container || !chatTarget) return;
        await loadData();
        const msgs = privateMessages.filter(m => 
            (m.fromUser === currentUser.username && m.toUser === chatTarget) ||
            (m.fromUser === chatTarget && m.toUser === currentUser.username)
        ).sort((a,b) => a.time - b.time);
        
        if (msgs.length === 0) {
            container.innerHTML = '<div class="chat-empty">no messages yet</div>';
            return;
        }
        container.innerHTML = msgs.map(m => `
            <div class="msg ${m.fromUser === currentUser.username ? 'sent' : 'received'}">
                ${m.fromUser === currentUser.username ? '→' : '←'} 
                ${escapeHtml(m.message)}
                ${m.postQuote ? `<div class="post-quote">📩 ${escapeHtml(m.postQuote)}</div>` : ''}
                <div class="time">${formatDate(m.time)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg || !chatTarget || !currentUser) return;
        input.value = '';
        await fetch('/api/privateMessages', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
                from: currentUser.username,
                to: chatTarget,
                message: msg,
                time: Date.now()
            })
        });
        await addNotification(chatTarget, currentUser.username, 'pm');
        await loadData();
        renderChatMessages();
        floatEmoji('✉️');
    }

    // Отправка поста в ЛС
    async function sendPostToPM(postId, targetUser) {
        if (!currentUser) { alert('log in first'); return; }
        if (!targetUser) targetUser = prompt('send post to username:');
        if (!targetUser) return;
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const quote = `post by ${post.author}: "${post.content.slice(0, 100)}${post.content.length > 100 ? '...' : ''}"`;
        await fetch('/api/privateMessages', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
                from: currentUser.username,
                to: targetUser,
                message: `📩 ${quote}`,
                time: Date.now(),
                postQuote: quote
            })
        });
        await addNotification(targetUser, currentUser.username, 'pm');
        floatEmoji('📩');
        if (chatTarget === targetUser) { await loadData(); renderChatMessages(); }
        alert(`✅ post sent to ${targetUser}`);
    }

    async function uploadMusic() {

        const file = fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('audio/')) { alert('please upload an audio file'); return; }
        startLoadingEmojis();
        const reader = new FileReader();
        reader.onload = async function(e) {
            await fetch('/api/posts', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ author: currentUser.username, content: '', time: Date.now(), fileName: file.name, fileData: e.target.result })
            });
            await loadData();
            showMusic();
            stopLoadingEmojis();
        };
        reader.readAsDataURL(file);
    }

    async function showProfile(username) {
        if (!username && !currentUser) return;
        const targetUser = username || currentUser.username;
        const user = users[targetUser];
        if (!user) return;
        const desc = user.description || '';
        const isOwnProfile = currentUser && currentUser.username === targetUser;
        const userPosts = posts.filter(p => p.author === targetUser && !p.pendingApproval);
        const postsCount = userPosts.length;
        const poemsCount = userPosts.filter(p => p.isPoem === 1).length;
        const musicCount = userPosts.filter(p => p.fileData && p.fileName && p.fileName.match(/\.(mp3|wav|ogg|m4a)$/i)).length;
        const photosCount = userPosts.filter(p => p.photo).length;

        let html = `
            <h2>${escapeHtml(targetUser)}${user.isAdmin ? ' <span style="color:#888;font-size:0.7em;">admin</span>' : ''}</h2>
            <p style="color:#aaa;">${escapeHtml(desc) || 'no description yet'}</p>
            <div class="profile-stats">
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'all')">📄 posts [${postsCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'poems')">✎ poems [${poemsCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'music')">🎵 music [${musicCount}]</span>
                <span onclick="filterUserPosts('${escapeHtml(targetUser)}', 'photos')">🖼️ photos [${photosCount}]</span>
            </div>
        `;
        if (isOwnProfile) {
            html += `
                <textarea id="descInput" rows="3" maxlength="300" placeholder="your description (max 300)">${escapeHtml(desc)}</textarea>
                <button id="saveDesc">save description</button>
                <button id="changePasswordBtn" class="change-password-btn">change password</button>
                <button id="deleteMyAccount" class="delete-account-btn">delete my account</button>
                <button onclick="openChat('${escapeHtml(targetUser)}')" style="background:transparent;color:#888;border:1px solid #888;padding:6px;margin:4px;">📬 messages</button>
            `;
        }
        if (!isOwnProfile && currentUser) {
            html += `<button onclick="openChat('${escapeHtml(targetUser)}')" style="margin:4px;">✉️ send message</button>`;
        }
        html += '<h3>posts</h3><div id="userPostsList"></div>';
        renderContent(html);
        await renderUserPosts(targetUser, 'all');
        if (isOwnProfile) {
            document.getElementById('saveDesc').onclick = async function() {
                const val = document.getElementById('descInput').value;
                await fetch(`/api/users/${currentUser.username}`, {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ description: val })
                });
                await loadData();
                showProfile(targetUser);
            };
            document.getElementById('changePasswordBtn').onclick = async function() {
                const oldPwd = prompt('current password:');
                if (!oldPwd) return;
                const newPwd = prompt('new password:');
                if (!newPwd) return;
                const confirmPwd = prompt('confirm new password:');
                if (newPwd !== confirmPwd) { alert('passwords do not match'); return; }
                const res = await fetch('/api/changePassword', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ username: currentUser.username, oldPassword: oldPwd, newPassword: newPwd })
                });
                if (res.ok) { alert('password changed! please log in again.'); spawnEditEmoji(); logout(); }
                else { alert('failed to change password'); }
            };
            document.getElementById('deleteMyAccount').onclick = function() {
                if (confirm('are you sure? this cannot be undone.')) deleteUser(currentUser.username);
            };
        }
        currentViewCallback = () => showProfile(targetUser);
    }

    // --- CRUD ПОСТОВ ---
    async function deletePost(id) {
        await fetch(`/api/posts/${id}`, { method: 'DELETE', headers: getHeaders() });
        await loadData();
        renderCurrentView();
    }

    async function editPost(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const newContent = prompt('edit your post:', post.content);
        if (newContent === null) return;
        const newHashtags = extractHashtags(newContent);
        const res = await fetch(`/api/posts/${postId}`, {
            method: 'PUT',
            headers: getHeaders(),
            body: JSON.stringify({ content: newContent, hashtags: newHashtags })
        });
        if (res.ok) { await loadData(); renderCurrentView(); spawnEditEmoji(); }
    }

    async function publishPost() {
        const content = document.getElementById('postContent').value;
        const hashtagsInput = document.getElementById('postHashtags')?.value || '';
        const fileInput = document.getElementById('postFile');
        const file = fileInput.files[0];
        const isPoem = document.getElementById('isPoemCheckbox')?.checked || false;
        let allHashtags = [...extractHashtags(content)];
        const manualHashtags = hashtagsInput.split(/\s+/).filter(h => h.startsWith('#')).map(h => h.slice(1));
        allHashtags = [...new Set([...allHashtags, ...manualHashtags])];
        startLoadingEmojis();
        const newPost = { author: currentUser.username, content: content || '', time: Date.now(), isPoem: isPoem ? 1 : 0, hashtags: allHashtags };
        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                if (file.type.startsWith('image/')) {
                    const photoId = Date.now() + '_' + Math.random();
                    newPost.pendingApproval = 1;
                    newPost.pendingId = photoId;
                    await fetch('/api/pendingPhotos', {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ id: photoId, author: currentUser.username, data: e.target.result })
                    });
                    await fetch('/api/posts', {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify(newPost)
                    });
                } else {
                    newPost.fileName = file.name;
                    newPost.fileData = e.target.result;
                    await fetch('/api/posts', {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify(newPost)
                    });
                }
                await loadData();
                showFeed();
                stopLoadingEmojis();
            };
            reader.readAsDataURL(file);
        } else {
            await fetch('/api/posts', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(newPost)
            });
            await loadData();
            showFeed();
            stopLoadingEmojis();
        }
    }

    async function approvePhoto(pendingId) {
        const pendingPhoto = pendingPhotos.find(p => p.id === pendingId);
        if (!pendingPhoto) return;
        const relatedPost = posts.find(p => p.pendingId === pendingId);
        if (relatedPost) await fetch(`/api/posts/${relatedPost.id}`, { method: 'DELETE', headers: getHeaders() });
        const newPost = { author: pendingPhoto.author, content: '', time: Date.now(), photo: pendingPhoto.data, pendingApproval: 0 };
        await fetch('/api/posts', { method: 'POST', headers: getHeaders(), body: JSON.stringify(newPost) });
        await fetch(`/api/pendingPhotos/${pendingId}`, { method: 'DELETE', headers: getHeaders() });
        await loadData();
        showFeed();
    }

    async function rejectPhoto(pendingId) {
        const postToDelete = posts.find(p => p.pendingId === pendingId);
        if (postToDelete) await fetch(`/api/posts/${postToDelete.id}`, { method: 'DELETE', headers: getHeaders() });
        await fetch(`/api/pendingPhotos/${pendingId}`, { method: 'DELETE', headers: getHeaders() });
        await loadData();
        showFeed();
    }

    async function deleteUser(username) {
        if (confirm(`are you sure you want to delete user "${username}"?`)) {
            startLoadingEmojis();
            await fetch(`/api/users/${username}`, { method: 'DELETE', headers: getHeaders() });
            if (currentUser && currentUser.username === username) logout();
            else { await loadData(); if (document.getElementById('userListContainer')) showUserList(); else showFeed(); }
            stopLoadingEmojis();
        }
    }

    async function authenticate(username, token) {
        currentUser = { username: username, isAdmin: users[username]?.isAdmin || false };
        if (token) {
            localStorage.setItem('token', token);
        }
        document.getElementById('btnLogin').style.display = 'none';
        document.getElementById('btnRegister').style.display = 'none';
        document.getElementById('loggedUser').textContent = username;
        document.getElementById('loggedUser').style.display = 'inline';
        document.getElementById('btnLogout').style.display = 'inline';
        document.getElementById('menuButtons').style.display = 'flex';
        document.getElementById('searchArea').style.display = 'flex';
        document.getElementById('notificationIcon').style.display = 'flex';
        spawnLoginEmojis();
        await loadNotifications();
        showFeed();
    }

    function logout() {
        stopLoadingEmojis();
        localStorage.removeItem('token');
        currentUser = null;
        notifications = [];
        commentsCache = {};
        currentSearchQuery = '';
        document.getElementById('btnLogin').style.display = 'inline-block';
        document.getElementById('btnRegister').style.display = 'inline-block';
        document.getElementById('loggedUser').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
        document.getElementById('menuButtons').style.display = 'none';
        document.getElementById('searchArea').style.display = 'none';
        document.getElementById('notificationIcon').style.display = 'none';
        renderContent('<p style="color:#888;">you have logged out. log in again to continue.</p>');
    }

    document.getElementById('btnLogout').onclick = logout;

    document.getElementById('notificationIcon').onclick = () => {
        const panel = document.getElementById('notificationPanel');
        if (panel) {
            panel.classList.toggle('show');
            if (panel.classList.contains('show')) renderNotificationPanel();
        }
    };

    document.getElementById('btnLogin').onclick = async function() {
        const name = prompt('username:');
        if (!name) return;
        const pass = prompt('password:');
        if (!pass) return;
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, password: pass })
            });
            if (res.status === 401) { alert('invalid credentials'); return; }
            if (res.status === 403) { alert('account banned'); return; }
            if (!res.ok) { alert('login failed'); return; }
            const data = await res.json();
            await loadData();
            authenticate(name, data.token);
        } catch(e) { alert('connection error'); }
    };

    document.getElementById('btnRegister').onclick = async function() {
        const name = prompt('choose username:');
        if (!name) return;
        if (name === 'Edd_Leon_CAt') { alert('username taken'); return; }
        const pass = prompt('choose password:');
        if (!pass) return;
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, password: pass })
            });
            if (res.status === 400) {
                const data = await res.text();
                if (data.includes('password')) alert('password too short! min 8 characters');
                else alert('username taken');
                return;
            }
            if (!res.ok) { alert('registration failed'); return; }
            // Автоматический логин после регистрации
            const loginRes = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, password: pass })
            });
            if (loginRes.ok) {
                const data = await loginRes.json();
                await loadData();
                authenticate(name, data.token);
            } else {
                alert('registration successful! please log in.');
            }
        } catch(e) { alert('connection error'); }
    };

    // ЗАКРЫТИЕ ЧАТА ПО ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeChat();
    });

    // ИНИЦИАЛИЗАЦИЯ
    (async () => {
        await loadData();
        // Проверяем, есть ли токен и пытаемся восстановить сессию
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const res = await fetch('/api/users', { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const usersData = await res.json();
                    // Находим пользователя по токену (неидеально, но для простоты)
                    // В идеале нужно /api/me, но пока так
                }
            } catch(e) {}
        }
        renderContent('<p style="color:#888;">Those who see darkness light the lamp.. log in or register to start.</p>');
    })();
</script>
